<html lang="pt-BR">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Levedex</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style id="main-style">
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F3ECDD; --surface:#FFFDF8; --surface2:#EFE4CC; --text:#241C10; --muted:#6B5D45;
  --line:#D9CBA8; --amber:#B8860B; --copper:#A85C2A; --gold1:#E8C766; --gold2:#A85C2A;
  --free:#5C7A3D; --premium:#A85C2A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14100D; --surface:#1F1810; --surface2:#2A2015; --text:#EDE6D6; --muted:#A89A82;
    --line:#34291A; --amber:#D9A62E; --copper:#C97C3D; --gold1:#F5D67B; --gold2:#C97C3D;
    --free:#7A9B52; --premium:#C97C3D;
  }
}
:root[data-theme="dark"]{
  --bg:#14100D; --surface:#1F1810; --surface2:#2A2015; --text:#EDE6D6; --muted:#A89A82;
  --line:#34291A; --amber:#D9A62E; --copper:#C97C3D; --gold1:#F5D67B; --gold2:#C97C3D;
  --free:#7A9B52; --premium:#C97C3D;
}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;}
header{padding:28px 18px 14px;max-width:920px;margin:0 auto;}
h1{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:clamp(28px,7vw,40px);margin:0 0 6px;letter-spacing:-0.01em;}
.sub{margin:0;color:var(--muted);font-size:14px;line-height:1.5;}
main{max-width:920px;margin:0 auto;padding:6px 18px 100px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(150px,100%),1fr));gap:10px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px;display:flex;flex-direction:column;gap:7px;min-width:0;overflow-wrap:anywhere;}
.card-top{display:flex;justify-content:space-between;align-items:center;}
.dex-no{font-family:'Fraunces',Georgia,serif;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}
.badge{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;}
.badge-free{background:color-mix(in srgb, var(--free) 18%, transparent);color:var(--free);}
.badge-premium{background:color-mix(in srgb, var(--premium) 18%, transparent);color:var(--premium);}
.name{font-family:'Fraunces',Georgia,serif;font-size:19px;margin:0;line-height:1.15;}
.maker{margin:0;font-size:12.5px;color:var(--muted);}
.type-row{display:flex;flex-direction:column;align-items:flex-start;margin-top:2px;gap:4px;}
.type-tag{font-size:12px;color:var(--muted);}
.rarity-wrap{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.rarity-symbol{font-size:13px;color:var(--amber);}
.rarity-label{font-size:11px;color:var(--muted);}
.stats{display:flex;flex-direction:column;gap:5px;margin-top:2px;}
.stat-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:3px 6px;}
.stat-label{font-size:11px;color:var(--muted);grid-column:1;grid-row:1;}
.stat-bar{grid-column:1/-1;height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;}
.stat-fill{height:100%;background:var(--amber);border-radius:3px;}
.stat-val{font-size:11px;color:var(--muted);text-align:right;grid-column:2;grid-row:1;}
.temp{margin:0;font-size:11.5px;color:var(--muted);}
.note{margin:2px 0 0;font-size:12px;color:var(--text);line-height:1.4;}
.tier-rare{border-color:var(--amber);}
.tier-double-rare{border:1px solid var(--amber);box-shadow:inset 0 0 0 1px var(--amber);}
.tier-ultra-rare{border:1px solid var(--copper);background:linear-gradient(160deg,var(--surface),var(--surface2));}
.tier-illustration-rare{border:1px solid var(--copper);background:linear-gradient(160deg,var(--surface2),var(--surface));box-shadow:0 0 18px -6px var(--copper);}
.tier-hyper-rare{border:1px solid var(--gold1);background:linear-gradient(155deg,var(--surface) 35%,var(--gold2) 260%);box-shadow:0 0 26px -4px var(--gold1);}
body.filter-free .card[data-status="premium"]{display:none;}
body.filter-premium .card[data-status="free"]{display:none;}
body.filter-pending .card[data-pending="0"]{display:none;}
body.hide-labels .label-text{display:none;}
body.edit-mode .card{cursor:pointer;outline:1px dashed var(--muted);outline-offset:2px;}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;border:none;background:var(--text);color:var(--bg);font-size:20px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;z-index:10;}
.fab:focus-visible,.chip:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
.fab-panel{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:10;min-width:196px;max-height:calc(100vh - 110px);overflow-y:auto;}
@media (prefers-reduced-motion:no-preference){.fab-panel{animation:pop .15s ease-out;}}
@keyframes pop{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.chip-row{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
.chip{flex:1;padding:7px 0;border-radius:20px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:12.5px;cursor:pointer;}
.chip.active{background:var(--text);color:var(--bg);border-color:var(--text);}
.switch-row{display:flex;align-items:center;justify-content:space-between;font-size:13px;gap:10px;margin-bottom:8px;}
.panel-btn{width:100%;text-align:left;background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--text);cursor:pointer;margin-top:8px;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:19;}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-radius:16px 16px 0 0;padding:16px 18px calc(16px + env(safe-area-inset-bottom,0px));z-index:20;max-height:80vh;overflow-y:auto;box-shadow:0 -8px 24px rgba(0,0,0,.25);}
.sheet h3{font-family:'Fraunces',Georgia,serif;margin:0 0 10px;font-size:18px;}
.sheet label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);margin-bottom:10px;}
.sheet input,.sheet select,.sheet textarea{font-size:14px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-family:inherit;}
.sheet textarea{resize:vertical;min-height:120px;}
.sheet-msg{font-size:12px;min-height:16px;color:var(--copper);margin:4px 0 0;}
.sheet-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;}
.btn-primary{background:var(--text);color:var(--bg);border:none;border-radius:20px;padding:9px 16px;font-size:13px;cursor:pointer;}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:9px 16px;font-size:13px;cursor:pointer;}
.search{width:100%;font-size:13px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-family:inherit;margin-bottom:10px;}
.card{cursor:pointer;}
.sprite{position:relative;aspect-ratio:4/3;border-radius:10px;display:grid;place-items:center;color:var(--text);background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--c) 45%,var(--surface2)),var(--surface2) 75%);border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));overflow:hidden;}
.sprite svg{height:84%;width:auto;}
.sprite-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--surface2);}
.sprite.big{aspect-ratio:16/10;}
.type-tag,.chip-type{font-size:12px;color:var(--text);padding:2px 9px;border-radius:20px;background:color-mix(in srgb,var(--c,var(--amber)) 24%,transparent);}
.modal{left:50%;right:auto;top:50%;bottom:auto;transform:translate(-50%,-50%);width:min(92vw,420px);border-radius:18px;padding-top:14px;}
.d-head{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
.d-name{font-family:'Fraunces',Georgia,serif;font-size:26px;margin:2px 0;line-height:1.1;}
.d-chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 12px;}
.d-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0;}
.d-grid div{background:var(--surface2);border-radius:10px;padding:8px 10px;}
.d-grid dt{font-size:11px;color:var(--muted);}
.d-grid dd{margin:2px 0 0;font-size:13px;}
.d-note{font-size:13px;line-height:1.5;border-left:3px solid var(--amber);padding-left:10px;margin:8px 0 12px;}
.about{margin-top:10px;font-size:13px;}
.about summary{cursor:pointer;color:var(--muted);padding:4px 0;}
.about a{display:block;color:var(--text);padding:6px 0;text-decoration:underline;text-underline-offset:3px;word-break:break-all;}
[hidden]{display:none!important;}
.badge-pending{background:color-mix(in srgb,var(--amber) 22%,transparent);color:var(--amber);}
.sprite-img.photo{object-fit:cover;}
.photo-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.photo-prev{width:72px;height:54px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer;}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:20px;font-size:13px;z-index:30;max-width:90vw;text-align:center;}
.dial{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-end;gap:12px;z-index:10;}
.dial-item{display:flex;align-items:center;gap:10px;}
.dial-label{background:var(--surface);border:1px solid var(--line);color:var(--text);font-size:12.5px;padding:5px 10px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.2);}
.mini-fab{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:18px;display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.25);margin-right:4px;}
.mini-fab:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
.fab-ico{display:inline-block;font-size:28px;line-height:1;}
@media (prefers-reduced-motion:no-preference){.dial{animation:pop .15s ease-out;}.fab-ico{transition:transform .2s;}}
.fab[aria-expanded="true"] .fab-ico{transform:rotate(45deg);}
.hop{background:radial-gradient(circle at 50% 0%,color-mix(in srgb,#7A9B52 38%,var(--surface)),var(--surface) 70%);overflow:hidden;text-align:center;}
.hop-bg{position:absolute;inset:0;pointer-events:none;opacity:.16;}
.hop-bg span{position:absolute;}
.hop-bg span:nth-child(1){left:8%;top:12%;}
.hop-bg span:nth-child(2){right:10%;top:34%;}
.hop-bg span:nth-child(3){left:18%;bottom:6%;}
.hop-hero,.hop-title,.hop-lead,.hop-nerd,.hop-bar,.hop .sheet-actions{position:relative;}
.hop-hero{display:grid;place-items:center;margin:6px 0 4px;}
.hop-title{font-family:'Fraunces',Georgia,serif;font-size:34px;margin:0;letter-spacing:-0.01em;}
.hop-lead{font-size:16px;line-height:1.45;margin:8px 0 10px;font-weight:600;}
.hop-nerd{font-size:13px;line-height:1.5;color:var(--muted);margin:0 0 14px;}
.hop-bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin:0 8px 14px;}
.hop-bar span{display:block;height:100%;width:60%;background:linear-gradient(90deg,#7A9B52,var(--amber));border-radius:3px;}
.hop .sheet-actions{justify-content:center;}
@keyframes drift{from{transform:translateY(-6px) rotate(-4deg);}to{transform:translateY(6px) rotate(4deg);}}
@media (prefers-reduced-motion:no-preference){.hop-bg span{animation:drift 7s ease-in-out infinite alternate;}.hop-bg span:nth-child(2){animation-duration:9s;}.hop-bg span:nth-child(3){animation-duration:11s;}.hop-hero svg{animation:drift 4s ease-in-out infinite alternate;}}
.hint{font-size:11.5px;color:var(--muted);margin:0 0 10px;line-height:1.4;}
</style>
</head>

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function cat(y){
  const t=norm(y.style+' '+y.name);
  if(/sem alcool|baixo teor/.test(t))return '#4FA3A5';
  if(/kveik/.test(t))return '#D4582A';
  if(/brett|sour|blend|selvag|lambic|lacto/.test(t))return '#8A5BA8';
  if(/trigo|weizen|wit|hefe/.test(t))return '#E4CE8A';
  if(/belga|trapp|saison|abadia/.test(t))return '#7A9B52';
  if(/lager|pilsner|bohem|bavar/.test(t))return '#E3C45A';
  return '#C98A2B';
}
function sprite(y){

    :`<path d="M46 56h28v36a14 14 0 0 1-14 14a14 14 0 0 1-14-14z" fill="${c}"/><path d="M46 24h28v68a14 14 0 0 1-14 14a14 14 0 0 1-14-14z" fill="#FFFDF8" fill-opacity=".22" ${sw}/><rect x="42" y="10" width="36" height="14" rx="3" fill="currentColor"/><circle cx="56" cy="80" r="4" fill="#FFFDF8" opacity=".85"/><circle cx="65" cy="91" r="3" fill="#FFFDF8" opacity=".85"/><circle cx="61" cy="67" r="3" fill="#FFFDF8" opacity=".85"/>`;
  return `<svg viewBox="0 0 120 120" aria-hidden="true">${inner}</svg>`;
}
function imgTag(y){

}

function showPrev(){if(formPhoto){fPhotoPrev.src=formPhoto;fPhotoPrev.hidden=false;}else{fPhotoPrev.removeAttribute('src');fPhotoPrev.hidden=true;}}
function shrink(file,max){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('read'));
    fr.onload=()=>{
      const im=new Image();
      im.onerror=()=>rej(new Error('img'));
      im.onload=()=>{
        const r=Math.min(1,max/Math.max(im.width,im.height));
        const c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(im.width*r));c.height=Math.max(1,Math.round(im.height*r));
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',0.7));
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function card(y){
  const statusLabel=y.pending?'A conferir':(y.estimated?'Estimado':(y.status==='free'?'Grátis':'Premium'));
  const t=TIERS[y.tier]||TIERS.common;
  const stats=y.pending?'':`<div class="stats">
<div class="stat-row"><span class="stat-label label-text">Atenuação</span><div class="stat-bar"><div class="stat-fill" style="width:${y.atn[1]}%"></div></div><span class="stat-val label-text">${y.atn[0]}–${y.atn[1]}%</span></div>
<div class="stat-row"><span class="stat-label label-text">Floculação</span><div class="stat-bar"><div class="stat-fill" style="width:${y.flocPct}%"></div></div><span class="stat-val label-text">${esc(y.floc)}</span></div>
</div>`;
  const types=y.pending?'':`<div class="type-row"><span class="type-tag label-text">${esc(y.style)}</span><span class="rarity-wrap"><span class="rarity-symbol">${t.r}</span><span class="rarity-label label-text">${t.label}</span></span></div>`;
  return `<article class="card tier-${y.tier}" data-status="${y.status}" data-n="${y.n}" data-pending="${(y.pending||y.estimated)?1:0}" style="--c:${cat(y)}">
<div class="sprite">${sprite(y)}${imgTag(y)}</div>
<div class="card-top"><span class="dex-no">Nº ${y.n}</span><span class="badge badge-${y.pending||y.estimated?'pending':y.status}">${statusLabel}</span></div>
<h2 class="name">${esc(y.name)}</h2>
<p class="maker label-text">${esc(y.maker)}</p>
${types}${stats}
</article>`;
}
let query='';
function norm(t){return String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}
function visible(){return query?YEASTS.filter(y=>norm([y.n,y.name,y.maker,y.style,y.note].join(' ')).includes(query)):YEASTS;}
function render(){const l=visible();grid.innerHTML=l.length?l.map(card).join(''):'<p class="hint">Nenhuma cepa encontrada.</p>';}
function updateCount(){
  const active=document.querySelector('.chip.active')?.dataset.filter||'all';
  const base=visible();const shown=active==='all'?base.length:active==='pending'?base.filter(y=>y.pending||y.estimated).length:base.filter(y=>y.status===active).length;
  countEl.textContent=shown+' cepas'+(active==='free'?' grátis':active==='premium'?' premium':active==='pending'?' a conferir':'');
}

  rows.forEach((r,i)=>{r[1].forEach((cx,j)=>{g+='<ellipse cx="'+cx+'" cy="'+r[0]+'" rx="12" ry="10" fill="'+((i+j)%2?'#5F8040':'#7A9B52')+'" stroke="#2F4A22" stroke-width="2"/>';});});

}

  fStatus.value=entry?entry.status:'free';fTier.value=entry?entry.tier:'common';

saveBtn.onclick=async()=>{

  if(!name||!maker||!style){formMsg.textContent='Nome, fabricante e estilo são obrigatórios.';return;}

  const flocPct=FLOC_MAP[floc.toLowerCase()]??55;
  const entry={n:editingN||nextN(),name,maker,style,status:fStatus.value,tier:fTier.value,atn,floc,flocPct,abv:fAbv.value.trim(),temp:fTemp.value.trim(),note:fNote.value.trim(),img:/^https:\/\//i.test(fImg.value.trim())?fImg.value.trim():'',photo:formPhoto};
  if(editingN){const i=YEASTS.findIndex(y=>y.n===editingN);if(i>-1)YEASTS[i]=entry;}
  else YEASTS.push(entry);

  await persist();
};

function normalizeEntry(raw,n){
  const status=/premium/i.test(raw.status)?'premium':'free';
  let tierKey='common';
  if(raw.tier){
    const rt=String(raw.tier).toLowerCase();
    tierKey=Object.keys(TIERS).find(k=>k===rt)||Object.keys(TIERS).find(k=>TIERS[k].label.toLowerCase()===rt)||'common';
  }
  let atn=raw.atn;
  if(typeof atn==='string'){const mm=atn.match(/(\d+)\D+(\d+)/);atn=mm?[+mm[1],+mm[2]]:[0,0];}
  if(!Array.isArray(atn))atn=[0,0];
  const floc=raw.floc||'Média';
  const flocPct=raw.flocPct!=null?+raw.flocPct:(FLOC_MAP[String(floc).toLowerCase()]??55);
  return {n:raw.n||n,name:raw.name||'Sem nome',maker:raw.maker||'',style:raw.style||'',status,tier:tierKey,atn,floc,flocPct,abv:raw.abv||'',temp:raw.temp||'',note:raw.note||'',img:/^https:\/\//i.test(raw.img||'')?raw.img:''};
}

function closeImport(){overlay.hidden=true;importSheet.hidden=true;}
importBtn.onclick=openImport;
cancelImportBtn.onclick=closeImport;
overlay.onclick=()=>{closeForm();closeImport();closeDetail();closeHop();};

document.getElementById('fillKnownBtn').onclick=()=>{importText.value=JSON.stringify(KNOWN,null,1);importMsg.textContent=KNOWN.length+' cepas preenchidas. Revise e toque em Adicionar.';};
doImportBtn.onclick=async()=>{
  let arr;
  try{arr=JSON.parse(importText.value);}catch(e){importMsg.textContent='JSON inválido.';return;}
  if(!Array.isArray(arr)||arr.length===0){importMsg.textContent='Esperado um array de objetos.';return;}
  let n=nextN();
  const key=y=>norm(y.name+'|'+y.maker);
  const have=new Set(YEASTS.map(key));
  let added=0,skipped=0;
  arr.forEach(raw=>{
    if(!raw||typeof raw!=='object'){skipped++;return;}
    const e=normalizeEntry(raw,n);
    if(have.has(key(e))){skipped++;return;}
    have.add(key(e));YEASTS.push(e);n=String(+n+1).padStart(3,'0');added++;
  });
  if(!added){importMsg.textContent='Nenhuma cepa nova: '+skipped+' já existente(s) ou inválida(s).';return;}
  render();updateCount();importText.value='';
  importMsg.textContent=added+' cepa(s) adicionada(s)'+(skipped?', '+skipped+' ignorada(s) por duplicidade.':'.');
  await persist();
};

function buildDoc(yeasts){
  const styleTxt=document.getElementById('main-style').textContent;
  const scriptTxt=document.getElementById('main-script').textContent;
  const head='<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>Levedex</title>\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">\n<style id="main-style">'+styleTxt+'</style>';
  const dataJson=JSON.stringify(yeasts).replace(/<\//g,'<\\/');
  return '<!DOCTYPE html>\n<html lang="pt-BR">\n<head>\n'+head+'\n</head>\n<body>\n<div id="app"></div>\n<script id="data-json" type="application/json">'+dataJson+'<'+'/script>\n<script id="main-script">'+scriptTxt+'<'+'/script>\n</body>\n</html>';
}
async function persist(){
  if(!window.claude)return;
  let art;
  try{art=await window.claude.use('artifact');}catch(e){art=null;}
  if(!art)return;
  try{await art.publish(buildDoc(YEASTS));}catch(e){/* conflict is routine; not_granted means read-only viewer */}
}
</script>
</body>
</html>
